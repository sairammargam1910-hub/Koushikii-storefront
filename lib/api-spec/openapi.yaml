openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shopify
    description: Shopify storefront operations
  - name: shopper
    description: Signed-in shopper preferences
  - name: content
    description: Storefront editorial content
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /shopify/products:
    get:
      operationId: getShopifyProducts
      tags: [shopify]
      summary: Get published sarees from Shopify
      description: Returns published Shopify products classified as sarees.
      responses:
        "200":
          description: Connected Shopify storefront catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyProductsResponse"
        "502":
          description: Shopify catalog could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/customer-account:
    get:
      operationId: getShopifyCustomerAccount
      tags: [shopify]
      summary: Get the connected Shopify customer account URL
      description: Returns the hosted Shopify account page where customers can check confirmed orders and delivery updates.
      responses:
        "200":
          description: Shopify hosted customer account page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCustomerAccountResponse"
        "502":
          description: Shopify account page could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/orders:
    get:
      operationId: getShopifyOrders
      tags: [shopper]
      summary: List Shopify orders for the signed-in shopper
      description: Returns orders matching a verified email address on the authenticated shopper's Clerk account.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: A page of the shopper's Shopify orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyOrdersResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A verified email is required to match orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify order history could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/orders/{orderRef}:
    get:
      operationId: getShopifyOrderDetails
      tags: [shopper]
      summary: Get an owned Shopify order
      description: Returns details only when the order's email matches a verified email on the authenticated shopper's account.
      parameters:
        - name: orderRef
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "200":
          description: Shopper-owned order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyOrderDetailsResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A verified email is required to match orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify order details could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/orders/{orderRef}/tracking:
    get:
      operationId: getShopifyOrderTracking
      tags: [shopper]
      summary: Get tracking updates for an owned order
      description: Returns Shopify fulfillment tracking and available Shiprocket tracking events for the authenticated shopper's order.
      parameters:
        - name: orderRef
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "200":
          description: Shipment tracking for the shopper-owned order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyOrderTrackingResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A verified email is required to match orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shipment tracking could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopper/preferences:
    get:
      operationId: getShopperPreferences
      tags: [shopper]
      summary: Get the signed-in shopper's saved preferences
      description: Returns wishlist and profile preferences stored privately for the authenticated Clerk user.
      responses:
        "200":
          description: Shopper preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopperPreferencesResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Shopper preferences could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearShopperPreferences
      tags: [shopper]
      summary: Clear all saved shopper preferences
      description: Removes the authenticated shopper's saved wishlist and profile preferences.
      responses:
        "204":
          description: Preferences cleared
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Shopper preferences could not be cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopper/preferences/wishlist:
    put:
      operationId: updateShopperWishlist
      tags: [shopper]
      summary: Replace the signed-in shopper's wishlist
      description: Saves wishlist product identifiers to the authenticated shopper's private account metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopperWishlistUpdate"
      responses:
        "200":
          description: Updated shopper preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopperPreferencesResponse"
        "400":
          description: Wishlist is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Shopper wishlist could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopper/preferences/profile:
    put:
      operationId: updateShopperProfile
      tags: [shopper]
      summary: Replace the signed-in shopper's profile preferences
      description: Saves optional contact details and saved addresses to the authenticated shopper's private account metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopperProfileUpdate"
      responses:
        "200":
          description: Updated shopper preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopperPreferencesResponse"
        "400":
          description: Profile preferences are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Shopper profile could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/countries:
    get:
      operationId: getShopifyAvailableCountries
      tags: [shopify]
      summary: List countries enabled for Shopify checkout
      responses:
        "200":
          description: Countries currently available in the Shopify storefront market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAvailableCountriesResponse"
        "502":
          description: Shopify market countries could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/cart:
    get:
      operationId: getShopifyCart
      tags: [shopify]
      summary: Get a Shopify cart
      description: Returns the current Shopify cart and its hosted checkout URL.
      parameters:
        - name: cartId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1000
      responses:
        "200":
          description: Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Invalid cart identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The selected delivery country is not enabled for Shopify checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify cart could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addShopifyCartLine
      tags: [shopify]
      summary: Add a product to a Shopify cart
      description: Creates a Shopify cart or adds a product to the existing cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartAddInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Product cannot be purchased or cart input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: India is not enabled as a Shopify selling market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify cart could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateShopifyCartLines
      tags: [shopify]
      summary: Update Shopify cart quantities
      description: Updates the quantities of existing lines in a Shopify cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartUpdateInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Cart input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: India is not enabled as a Shopify selling market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify cart could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/cart/remove-lines:
    post:
      operationId: removeShopifyCartLines
      tags: [shopify]
      summary: Remove lines from a Shopify cart
      description: Removes the specified merchandise lines and returns the updated cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartLinesRemoveInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Cart input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: India is not enabled as a Shopify selling market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify cart could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/cart/discount-codes:
    post:
      operationId: updateShopifyCartDiscountCodes
      tags: [shopify]
      summary: Apply or remove discount codes from a Shopify cart
      description: Updates the discount codes stored on the Shopify cart and returns Shopify's applicability result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartDiscountCodesInput"
      responses:
        "200":
          description: Updated Shopify cart and discount status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Invalid cart or discount code input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: India is not enabled as a Shopify selling market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify could not update the cart discounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/cart/buyer-identity:
    post:
      operationId: updateShopifyCartBuyerIdentity
      tags: [shopify]
      summary: Prepare a Shopify cart with buyer details
      description: Sends shopper-entered contact details and a one-time delivery address to Shopify before secure hosted payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartBuyerIdentityInput"
      responses:
        "200":
          description: Updated Shopify cart ready for checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Invalid checkout contact or delivery details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The selected delivery country is not enabled for this Shopify store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify checkout details could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/checkout/quote:
    post:
      operationId: createShopifyCheckoutQuote
      tags: [shopify]
      summary: Create an address and parcel-specific delivery quote
      description: Revalidates the live Shopify cart and creates a short-lived shipping quote. Unsupported destinations and unconfirmed carrier routes are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCheckoutQuoteInput"
      responses:
        "200":
          description: Current checkout quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCheckoutQuoteResponse"
        "400":
          description: Invalid checkout details or cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Cart changed, the address is unsupported, or no carrier service is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many quote requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Shipping quote cannot be produced safely for this destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify or the carrier could not return a valid quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/checkout/payment-session:
    post:
      operationId: createShopifyCheckoutPaymentSession
      tags: [shopify]
      summary: Create a Cashfree payment session for a valid quote
      description: Sandbox is the default. Production requires an explicit live-checkout flag and separate production credentials. The server checks quote expiry, current cart contents, payment currency, and Shopify order-writing permission before creating a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCheckoutPaymentSessionInput"
      responses:
        "200":
          description: Existing idempotent or newly created payment session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCheckoutPaymentSessionResponse"
        "400":
          description: Invalid quote reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Quote expired or cart contents changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many payment attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Sandbox payment prerequisites or Shopify order permissions are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/checkout/payment-status:
    get:
      operationId: getShopifyCheckoutPaymentStatus
      tags: [shopify]
      summary: Verify a Cashfree payment and recover order synchronization
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "400":
          description: Invalid Cashfree order reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Server-verified payment and synchronization status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCheckoutPaymentStatusResponse"
        "404":
          description: Checkout order was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Payment provider or order synchronization could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /cashfree/webhook:
    post:
      operationId: receiveCashfreeCheckoutWebhook
      tags: [shopify]
      summary: Reconcile signed Cashfree payment notifications
      description: Verifies the Cashfree signature over the exact raw body, then queries Cashfree before recording payment as paid.
      parameters:
        - name: x-webhook-signature
          in: header
          required: true
          schema:
            type: string
        - name: x-webhook-timestamp
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashfreeWebhookInput"
      responses:
        "200":
          description: Verified notification accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashfreeWebhookAck"
        "400":
          description: Invalid webhook payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid webhook signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Checkout order was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Webhook reconciliation will be retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/images:
    post:
      operationId: uploadShopifyAdminImage
      summary: Stage a product photo in Shopify (merchant only)
      description: Upload one JPEG, PNG, or WebP image up to 10 MiB. Returns a temporary source for the product create/update imageUrl field. No existing product media is changed.
      tags: [ShopifyAdmin]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              $ref: "#/components/schemas/ShopifyAdminImageInput"
          image/png:
            schema:
              $ref: "#/components/schemas/ShopifyAdminImageInput"
          image/webp:
            schema:
              $ref: "#/components/schemas/ShopifyAdminImageInput"
      responses:
        "201":
          description: Image uploaded to Shopify staging storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminImageResponse"
        "400":
          description: Invalid, empty, corrupt, or unsupported image
        "401":
          description: Sign-in required
        "403":
          description: Merchant access required
        "413":
          description: Image exceeds 10 MiB
        "429":
          description: Too many concurrent uploads
        "502":
          description: Shopify upload failed
  /shopify/admin/products:
    get:
      operationId: getShopifyAdminProducts
      tags: [shopify]
      summary: List products for the merchant dashboard
      description: Lists Shopify products for the authenticated store owner.
      responses:
        "200":
          description: Shopify product catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductsResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify products could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createShopifyAdminProduct
      tags: [shopify]
      summary: Create a Shopify product
      description: Creates a Shopify product with optional structured attributes and collection assignments, then optionally publishes it to the storefront.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminProductInput"
      responses:
        "201":
          description: Shopify product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "400":
          description: Product details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/collections:
    get:
      operationId: getShopifyAdminCollections
      tags: [shopify]
      summary: List Shopify collections for product assignment
      description: Lists manually-managed Shopify collections available to the merchant product editor.
      responses:
        "200":
          description: Shopify collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminCollectionsResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify collections could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/inventory:
    get:
      operationId: getShopifyAdminInventory
      tags: [shopify]
      summary: Load current variant stock by location
      description: Reads tracked Shopify available quantities for every variant and location without changing inventory.
      responses:
        "200":
          description: Current variant inventory locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminInventoryResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify inventory could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    get:
      operationId: getShopifyAdminProduct
      tags: [shopify]
      summary: Load every variant and inventory location for a product
      responses:
        "200":
          description: Current Shopify product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
    patch:
      operationId: updateShopifyAdminProduct
      tags: [shopify]
      summary: Update a Shopify product
      description: Updates shared product details or storefront publication. Use the variant endpoint for existing prices and location stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminProductUpdate"
      responses:
        "200":
          description: Shopify product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "400":
          description: Product details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify product was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: archiveShopifyAdminProduct
      tags: [shopify]
      summary: Archive a Shopify product
      description: Archives the product in Shopify so it is hidden without deleting its history.
      responses:
        "200":
          description: Shopify product archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminArchiveResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify product was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}/permanently:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    delete:
      operationId: permanentlyDeleteShopifyAdminProduct
      tags: [shopify]
      summary: Permanently delete a Shopify product
      description: Removes the product from Shopify. This cannot be undone; archive the product to hide it without permanent deletion.
      responses:
        "200":
          description: Shopify product permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductDeleteResponse"
        "400":
          description: Product ID is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}/variants/{variantId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      - name: variantId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateShopifyAdminVariant
      tags: [shopify]
      summary: Update a variant price or compare-and-set stock at one location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminVariantUpdate"
      responses:
        "200":
          description: Fresh Shopify product after update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "409":
          description: Stock changed since it was loaded; refresh before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteShopifyAdminVariant
      tags: [shopify]
      summary: Retire a Shopify product variant
      description: Permanently deletes the selected variant. The product's last and default variants cannot be deleted.
      responses:
        "200":
          description: Fresh Shopify product after deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "400":
          description: The variant cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The product or variant was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify could not delete the variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}/variants:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    post:
      operationId: createShopifyAdminVariant
      tags: [shopify]
      summary: Create a Shopify variant from product options
      description: Adds missing values to existing options and creates one variant. It does not enable inventory tracking or set stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminVariantCreate"
      responses:
        "200":
          description: Fresh Shopify product after creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "400":
          description: The option combination or price is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify product was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify could not create the variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}/media:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getShopifyAdminProductMedia
      tags: [shopify]
      summary: List all media for a Shopify product
