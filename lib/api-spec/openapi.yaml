openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shopify
    description: Shopify storefront operations
  - name: shopper
    description: Signed-in shopper preferences
  - name: content
    description: Storefront editorial content
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /shopify/products:
    get:
      operationId: getShopifyProducts
      tags: [shopify]
      summary: Get published sarees from Shopify
      description: Returns published Shopify products classified as sarees.
      responses:
        "200":
          description: Connected Shopify saree catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyProductsResponse"
        "502":
          description: Shopify catalog could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/customer-account:
    get:
      operationId: getShopifyCustomerAccount
      tags: [shopify]
      summary: Get the connected Shopify customer account URL
      description: Returns the hosted Shopify account page where customers can check confirmed orders and delivery updates.
      responses:
        "200":
          description: Shopify hosted customer account page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCustomerAccountResponse"
        "502":
          description: Shopify account page could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopper/preferences:
    get:
      operationId: getShopperPreferences
      tags: [shopper]
      summary: Get the signed-in shopper's saved preferences
      description: Returns wishlist and profile preferences stored privately for the authenticated Clerk user.
      responses:
        "200":
          description: Shopper preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopperPreferencesResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Shopper preferences could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearShopperPreferences
      tags: [shopper]
      summary: Clear all saved shopper preferences
      description: Removes the authenticated shopper's saved wishlist and profile preferences.
      responses:
        "204":
          description: Preferences cleared
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Shopper preferences could not be cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopper/preferences/wishlist:
    put:
      operationId: updateShopperWishlist
      tags: [shopper]
      summary: Replace the signed-in shopper's wishlist
      description: Saves wishlist product identifiers to the authenticated shopper's private account metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopperWishlistUpdate"
      responses:
        "200":
          description: Updated shopper preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopperPreferencesResponse"
        "400":
          description: Wishlist is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Shopper wishlist could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopper/preferences/profile:
    put:
      operationId: updateShopperProfile
      tags: [shopper]
      summary: Replace the signed-in shopper's profile preferences
      description: Saves optional contact details and saved addresses to the authenticated shopper's private account metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopperProfileUpdate"
      responses:
        "200":
          description: Updated shopper preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopperPreferencesResponse"
        "400":
          description: Profile preferences are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Shopper profile could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/cart:
    get:
      operationId: getShopifyCart
      tags: [shopify]
      summary: Get a Shopify cart
      description: Returns the current Shopify cart and its hosted checkout URL.
      parameters:
        - name: cartId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1000
      responses:
        "200":
          description: Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Invalid cart identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: India is not enabled as a Shopify selling market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify cart could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addShopifyCartLine
      tags: [shopify]
      summary: Add a product to a Shopify cart
      description: Creates a Shopify cart or adds a product to the existing cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartAddInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Product cannot be purchased or cart input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: India is not enabled as a Shopify selling market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify cart could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateShopifyCartLines
      tags: [shopify]
      summary: Update Shopify cart quantities
      description: Updates or removes lines in a Shopify cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartUpdateInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Cart input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: India is not enabled as a Shopify selling market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify cart could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/cart/discount-codes:
    post:
      operationId: updateShopifyCartDiscountCodes
      tags: [shopify]
      summary: Apply or remove discount codes from a Shopify cart
      description: Updates the discount codes stored on the Shopify cart and returns Shopify's applicability result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartDiscountCodesInput"
      responses:
        "200":
          description: Updated Shopify cart and discount status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Invalid cart or discount code input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: India is not enabled as a Shopify selling market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify could not update the cart discounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/cart/buyer-identity:
    post:
      operationId: updateShopifyCartBuyerIdentity
      tags: [shopify]
      summary: Prefill a Shopify cart with saved shopper details
      description: Sends the signed-in shopper's selected saved delivery address and optional contact details to Shopify for checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartBuyerIdentityInput"
      responses:
        "200":
          description: Updated Shopify cart ready for checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Invalid cart identity or saved address details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: India is not enabled as a Shopify selling market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify checkout details could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/images:
    post:
      operationId: uploadShopifyAdminImage
      summary: Stage a product photo in Shopify (merchant only)
      description: Upload one JPEG, PNG, or WebP image up to 10 MiB. Returns a temporary source for the product create/update imageUrl field. No existing product media is changed.
      tags: [ShopifyAdmin]
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              $ref: "#/components/schemas/ShopifyAdminImageInput"
          image/png:
            schema:
              $ref: "#/components/schemas/ShopifyAdminImageInput"
          image/webp:
            schema:
              $ref: "#/components/schemas/ShopifyAdminImageInput"
      responses:
        "201":
          description: Image uploaded to Shopify staging storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminImageResponse"
        "400":
          description: Invalid, empty, corrupt, or unsupported image
        "401":
          description: Sign-in required
        "403":
          description: Merchant access required
        "413":
          description: Image exceeds 10 MiB
        "429":
          description: Too many concurrent uploads
        "502":
          description: Shopify upload failed
  /shopify/admin/products:
    get:
      operationId: getShopifyAdminProducts
      tags: [shopify]
      summary: List products for the merchant dashboard
      description: Lists Shopify products for the authenticated store owner.
      responses:
        "200":
          description: Shopify product catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductsResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify products could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createShopifyAdminProduct
      tags: [shopify]
      summary: Create a Shopify product
      description: Creates a single-variant saree product and optionally publishes it to the storefront.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminProductInput"
      responses:
        "201":
          description: Shopify product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "400":
          description: Product details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/inventory:
    get:
      operationId: getShopifyAdminInventory
      tags: [shopify]
      summary: Load current variant stock by location
      description: Reads tracked Shopify available quantities for every variant and location without changing inventory.
      responses:
        "200":
          description: Current variant inventory locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminInventoryResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify inventory could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    get:
      operationId: getShopifyAdminProduct
      tags: [shopify]
      summary: Load every variant and inventory location for a product
      responses:
        "200":
          description: Current Shopify product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
    patch:
      operationId: updateShopifyAdminProduct
      tags: [shopify]
      summary: Update a Shopify product
      description: Updates shared product details or storefront publication. Use the variant endpoint for existing prices and location stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminProductUpdate"
      responses:
        "200":
          description: Shopify product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "400":
          description: Product details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify product was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: archiveShopifyAdminProduct
      tags: [shopify]
      summary: Archive a Shopify product
      description: Archives the product in Shopify so it is hidden without deleting its history.
      responses:
        "200":
          description: Shopify product archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminArchiveResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify product was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}/permanently:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    delete:
      operationId: permanentlyDeleteShopifyAdminProduct
      tags: [shopify]
      summary: Permanently delete a Shopify product
      description: Removes the product from Shopify. This cannot be undone; archive the product to hide it without permanent deletion.
      responses:
        "200":
          description: Shopify product permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductDeleteResponse"
        "400":
          description: Product ID is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}/variants/{variantId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      - name: variantId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateShopifyAdminVariant
      tags: [shopify]
      summary: Update a variant price or compare-and-set stock at one location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminVariantUpdate"
      responses:
        "200":
          description: Fresh Shopify product after update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "409":
          description: Stock changed since it was loaded; refresh before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteShopifyAdminVariant
      tags: [shopify]
      summary: Retire a Shopify product variant
      description: Permanently deletes the selected variant. The product's last and default variants cannot be deleted.
      responses:
        "200":
          description: Fresh Shopify product after deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "400":
          description: The variant cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The product or variant was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify could not delete the variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}/variants:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    post:
      operationId: createShopifyAdminVariant
      tags: [shopify]
      summary: Create a Shopify variant from product options
      description: Adds missing values to existing options and creates one variant. It does not enable inventory tracking or set stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminVariantCreate"
      responses:
        "200":
          description: Fresh Shopify product after creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "400":
          description: The option combination or price is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify product was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify could not create the variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}/media:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getShopifyAdminProductMedia
      tags: [shopify]
      summary: List all media for a Shopify product
      description: Returns every media item, including its processing status and any Shopify media errors.
      responses:
        "200":
          description: Product gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductMediaResponse"
        "400":
          description: Product ID is invalid
        "401":
          description: Sign-in required
        "403":
          description: Store owner access required
        "404":
          description: Product was not found
        "502":
          description: Product media could not be loaded
    post:
      operationId: updateShopifyAdminProductMedia
      tags: [shopify]
      summary: Add or replace one product photo
      description: Adds a staged image, optionally removing only the selected image after the new image has been accepted by Shopify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminProductMediaInput"
      responses:
        "200":
          description: Updated product gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductMediaUpdateResponse"
        "400":
          description: Media input is invalid
        "401":
          description: Sign-in required
        "403":
          description: Store owner access required
        "404":
          description: Product or selected media was not found
        "502":
          description: Shopify could not update the gallery
  /shopify/admin/products/{productId}/media/order:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: reorderShopifyAdminProductMedia
      tags: [shopify]
      summary: Reorder all media for a Shopify product
      description: Reorders the complete gallery; the first image becomes the featured image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminProductMediaOrder"
      responses:
        "200":
          description: Reordered product gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductMediaResponse"
        "400":
          description: Media order is invalid
        "409":
          description: Gallery order changed since the merchant loaded it
        "401":
          description: Sign-in required
        "403":
          description: Store owner access required
        "404":
          description: Product was not found
        "502":
          description: Shopify could not reorder the gallery
  /shopify/admin/products/{productId}/media/{mediaId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteShopifyAdminProductMedia
      tags: [shopify]
      summary: Remove one item from a Shopify product gallery
      description: Removes only the selected media item; all other gallery items are preserved.
      responses:
        "200":
          description: Updated product gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductMediaResponse"
        "400":
          description: Product or media ID is invalid
        "401":
          description: Sign-in required
        "403":
          description: Store owner access required
        "404":
          description: Product or media was not found
        "502":
          description: Shopify could not remove the media
    patch:
      operationId: updateShopifyAdminProductMediaAlt
      tags: [shopify]
      summary: Update one product image description
      description: Saves alternative text for one image in the product gallery without changing other media.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminProductMediaAltUpdate"
      responses:
        "200":
          description: Updated product gallery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductMediaResponse"
        "400":
          description: Product, media ID, or alternative text is invalid
        "401":
          description: Sign-in required
        "403":
          description: Store owner access required
        "404":
          description: Product or image was not found
        "502":
          description: Shopify could not update the image description
  /shopify/admin/discounts:
    get:
      operationId: getShopifyAdminDiscounts
      tags: [shopify]
      summary: List Shopify discount codes
      description: Lists discount codes for the authenticated store owner.
      responses:
        "200":
          description: Shopify discount codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminDiscountsResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify discount codes could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createShopifyAdminDiscount
      tags: [shopify]
      summary: Create a percentage discount code
      description: Creates a Shopify discount code for all products.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminDiscountInput"
      responses:
        "201":
          description: Shopify discount code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminDiscountResponse"
        "400":
          description: Discount details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify discount code could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/discounts/{discountId}:
    parameters:
      - name: discountId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    delete:
      operationId: deactivateShopifyAdminDiscount
      tags: [shopify]
      summary: Deactivate a Shopify discount code
      description: Deactivates the discount code without permanently deleting its record.
      responses:
        "200":
          description: Shopify discount deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminArchiveResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify discount was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify discount could not be deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /site-content:
    get:
      operationId: getSiteContent
      tags: [content]
      summary: Get published storefront content
      description: Returns published homepage slides, images, approved customer voices, and video posts.
      responses:
        "200":
          description: Published storefront content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentListResponse"
    post:
      operationId: createSiteContent
      tags: [content]
      summary: Create a storefront content item
      description: Creates a draft or published content item for the connected store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentInput"
      responses:
        "201":
          description: Content item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentItem"
        "400":
          description: Content is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /site-content/admin:
    get:
      operationId: getAdminSiteContent
      tags: [content]
      summary: Get all storefront content for the merchant
      description: Returns published and draft content for the authenticated store owner.
      responses:
        "200":
          description: Merchant content list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentListResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /site-content/{id}:
    put:
      operationId: updateSiteContent
      tags: [content]
      summary: Update storefront content
      description: Replaces the editable fields for one content item.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentInput"
      responses:
        "200":
          description: Content item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentItem"
        "400":
          description: Content is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Content item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteSiteContent
      tags: [content]
      summary: Delete storefront content
      description: Removes one content item from the connected store.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Content item deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentDeleteResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Content item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /site-content/uploads:
    post:
      operationId: requestSiteContentUpload
      tags: [content]
      summary: Request a direct upload URL for site media
      description: Creates a short-lived upload URL for a merchant image or video. Files are uploaded directly to persistent App Storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentUploadInput"
      responses:
        "201":
          description: Short-lived upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentUploadResponse"
        "400":
          description: File type or size is not supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /site-content/media/{assetId}:
    get:
      operationId: getSiteContentMedia
      tags: [content]
      summary: Serve a published storefront media asset
      description: Streams one media asset from persistent App Storage after checking its access policy.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public site image or video
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            video/mp4: {}
            video/webm: {}
        "404":
          description: Media asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ShopifyImage:
      type: object
      properties:
        url:
          type: string
          format: uri
        altText:
          type: [string, "null"]
      required: [url, altText]
    ShopifyOption:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required: [name, value]
    ShopifyVariant:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        availableForSale:
          type: boolean
        price:
          type: string
        currencyCode:
          type: string
        selectedOptions:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyOption"
      required: [id, title, availableForSale, price, currencyCode, selectedOptions]
    ShopifyProduct:
      type: object
      properties:
        id:
          type: string
        handle:
          type: string
        title:
          type: string
        description:
          type: string
        productType:
          type: string
        tags:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyImage"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyVariant"
      required: [id, handle, title, description, productType, tags, images, variants]
    ShopifyProductsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyProduct"
        totalPublishedProducts:
          type: integer
        truncated:
          type: boolean
      required: [products, totalPublishedProducts, truncated]
    ShopifyCustomerAccountResponse:
      type: object
      properties:
        accountUrl:
          type: string
          format: uri
      required: [accountUrl]
    ShopifyCartAddInput:
      type: object
      properties:
        cartId:
          type: string
          minLength: 1
          maxLength: 1000
        merchandiseId:
          type: string
          minLength: 1
          maxLength: 250
        quantity:
          type: integer
          minimum: 1
          maximum: 99
      required: [merchandiseId, quantity]
    ShopifyCartLineUpdate:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1000
        quantity:
          type: integer
          minimum: 0
          maximum: 99
      required: [id, quantity]
    ShopifyCartUpdateInput:
      type: object
      properties:
        cartId:
          type: string
          minLength: 1
          maxLength: 1000
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ShopifyCartLineUpdate"
      required: [cartId, lines]
    ShopifyCartDiscountCodesInput:
      type: object
      properties:
        cartId:
          type: string
          minLength: 1
          maxLength: 1000
        discountCodes:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 128
      required: [cartId, discountCodes]
    ShopifyCartBuyerIdentityInput:
      type: object
      properties:
        cartId:
          type: string
          minLength: 1
          maxLength: 1000
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        deliveryAddress:
          type: object
          properties:
            recipient:
              type: string
              minLength: 1
              maxLength: 160
            street:
              type: string
              minLength: 1
              maxLength: 500
            city:
              type: string
              minLength: 1
              maxLength: 160
            state:
              type: string
              minLength: 1
              maxLength: 160
            pin:
              type: string
              pattern: "^[1-9][0-9]{5}$"
          required: [recipient, street, city, state, pin]
      required: [cartId, deliveryAddress]
    ShopifyCartDiscountCode:
      type: object
      properties:
        code:
          type: string
        applicable:
          type: boolean
      required: [code, applicable]
    ShopifyCartLine:
      type: object
      properties:
        id:
          type: string
        merchandiseId:
          type: string
        productHandle:
          type: string
        productTitle:
          type: string
        variantTitle:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: string
        currencyCode:
          type: string
        availableForSale:
          type: boolean
        isDemo:
          type: boolean
        image:
          anyOf:
            - $ref: "#/components/schemas/ShopifyImage"
            - type: "null"
      required: [id, merchandiseId, productHandle, productTitle, variantTitle, quantity, unitPrice, currencyCode, availableForSale, isDemo, image]
    ShopifyCartResponse:
      type: object
      properties:
        id:
          type: string
        checkoutUrl:
          type: ["string", "null"]
          format: uri
        totalQuantity:
          type: integer
        subtotalAmount:
          type: string
        discountAmount:
          type: string
        totalAmount:
          type: string
        currencyCode:
          type: string
        discountCodes:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyCartDiscountCode"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyCartLine"
      required: [id, checkoutUrl, totalQuantity, subtotalAmount, discountAmount, totalAmount, currencyCode, discountCodes, lines]
    ShopifyAdminInventoryLevel:
