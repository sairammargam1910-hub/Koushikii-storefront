components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ShopifyOrderLineItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        variantTitle:
          type: [string, "null"]
        sku:
          type: [string, "null"]
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: string
        totalPrice:
          type: string
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
        image:
          anyOf:
            - $ref: "#/components/schemas/ShopifyImage"
            - type: "null"
      required: [id, title, variantTitle, sku, quantity, unitPrice, totalPrice, currencyCode, image]
    ShopifyOrderSummary:
      type: object
      properties:
        orderRef:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        processedAt:
          type: [string, "null"]
          format: date-time
        financialStatus:
          type: string
        fulfillmentStatus:
          type: [string, "null"]
        totalAmount:
          type: string
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyOrderLineItem"
      required: [orderRef, name, createdAt, processedAt, financialStatus, fulfillmentStatus, totalAmount, currencyCode, lineItems]
    ShopifyOrderFulfillment:
      type: object
      properties:
        status:
          type: string
        trackingCompany:
          type: [string, "null"]
        trackingNumber:
          type: [string, "null"]
        trackingUrl:
          type: [string, "null"]
          format: uri
        estimatedDeliveryAt:
          type: [string, "null"]
          format: date-time
      required: [status, trackingCompany, trackingNumber, trackingUrl, estimatedDeliveryAt]
    ShopifyOrderDetails:
      allOf:
        - $ref: "#/components/schemas/ShopifyOrderSummary"
        - type: object
          properties:
            fulfillments:
              type: array
              items:
                $ref: "#/components/schemas/ShopifyOrderFulfillment"
          required: [fulfillments]
    ShopifyOrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyOrderSummary"
        nextCursor:
          type: [string, "null"]
      required: [orders, nextCursor]
    ShopifyOrderDetailsResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/ShopifyOrderDetails"
      required: [order]
    ShopifyOrderTrackingEvent:
      type: object
      properties:
        occurredAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
        description:
          type: string
        location:
          type: [string, "null"]
      required: [occurredAt, status, description, location]
    ShipmentLifecycleStatus:
      type: string
      enum:
        - quoted
        - booking_pending
        - booked
        - pickup_scheduled
        - picked_up
        - in_transit
        - out_for_delivery
        - delivered
        - booking_failed
        - cancelled
        - returned
    ShopifyOrderTrackingShipment:
      type: object
      properties:
        status:
          type: string
        shipmentStatus:
          anyOf:
            - $ref: "#/components/schemas/ShipmentLifecycleStatus"
            - type: "null"
        statusCode:
          type: [string, "null"]
        awbCode:
          type: [string, "null"]
        courierName:
          type: [string, "null"]
        trackingUrl:
          type: [string, "null"]
          format: uri
        estimatedDeliveryAt:
          type: [string, "null"]
          format: date-time
        events:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyOrderTrackingEvent"
      required: [status, shipmentStatus, statusCode, awbCode, courierName, trackingUrl, estimatedDeliveryAt, events]
    ShopifyOrderTrackingResponse:
      type: object
      properties:
        orderRef:
          type: string
        shipments:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyOrderTrackingShipment"
      required: [orderRef, shipments]
    ShopifyImage:
      type: object
      properties:
        url:
          type: string
          format: uri
        altText:
          type: [string, "null"]
      required: [url, altText]
    ShopifyOption:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required: [name, value]
    ShopifyVariant:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        availableForSale:
          type: boolean
        price:
          type: string
        currencyCode:
          type: string
        selectedOptions:
          type: array
          items:
