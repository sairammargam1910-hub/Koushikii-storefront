openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shopify
    description: Shopify storefront operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /shopify/products:
    get:
      operationId: getShopifyProducts
      tags: [shopify]
      summary: Get published sarees from Shopify
      description: Returns published Shopify products classified as sarees.
      responses:
        "200":
          description: Connected Shopify saree catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyProductsResponse"
        "502":
          description: Shopify catalog could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/cart:
    get:
      operationId: getShopifyCart
      tags: [shopify]
      summary: Get a Shopify cart
      description: Returns the current Shopify cart and its hosted checkout URL.
      parameters:
        - name: cartId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1000
      responses:
        "200":
          description: Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Invalid cart identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify cart could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addShopifyCartLine
      tags: [shopify]
      summary: Add a product to a Shopify cart
      description: Creates a Shopify cart or adds a product to the existing cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartAddInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Product cannot be purchased or cart input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify cart could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateShopifyCartLines
      tags: [shopify]
      summary: Update Shopify cart quantities
      description: Updates or removes lines in a Shopify cart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyCartUpdateInput"
      responses:
        "200":
          description: Updated Shopify cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCartResponse"
        "400":
          description: Cart input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify cart could not be found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify cart could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products:
    get:
      operationId: getShopifyAdminProducts
      tags: [shopify]
      summary: List products for the merchant dashboard
      description: Lists Shopify products for the authenticated store owner.
      responses:
        "200":
          description: Shopify product catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductsResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify products could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createShopifyAdminProduct
      tags: [shopify]
      summary: Create a Shopify product
      description: Creates a single-variant saree product and optionally publishes it to the storefront.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminProductInput"
      responses:
        "201":
          description: Shopify product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "400":
          description: Product details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    patch:
      operationId: updateShopifyAdminProduct
      tags: [shopify]
      summary: Update a Shopify product
      description: Updates product details, price, stock, or storefront publication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminProductUpdate"
      responses:
        "200":
          description: Shopify product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminProductResponse"
        "400":
          description: Product details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify product was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: archiveShopifyAdminProduct
      tags: [shopify]
      summary: Archive a Shopify product
      description: Archives the product in Shopify so it is hidden without deleting its history.
      responses:
        "200":
          description: Shopify product archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminArchiveResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify product was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify product could not be archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/discounts:
    get:
      operationId: getShopifyAdminDiscounts
      tags: [shopify]
      summary: List Shopify discount codes
      description: Lists discount codes for the authenticated store owner.
      responses:
        "200":
          description: Shopify discount codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminDiscountsResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify discount codes could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createShopifyAdminDiscount
      tags: [shopify]
      summary: Create a percentage discount code
      description: Creates a Shopify discount code for all products.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyAdminDiscountInput"
      responses:
        "201":
          description: Shopify discount code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminDiscountResponse"
        "400":
          description: Discount details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify discount code could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /shopify/admin/discounts/{discountId}:
    parameters:
      - name: discountId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
    delete:
      operationId: deactivateShopifyAdminDiscount
      tags: [shopify]
      summary: Deactivate a Shopify discount code
      description: Deactivates the discount code without permanently deleting its record.
      responses:
        "200":
          description: Shopify discount deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyAdminArchiveResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Store owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Shopify discount was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Shopify discount could not be deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ShopifyImage:
      type: object
      properties:
        url:
          type: string
          format: uri
        altText:
          type: [string, "null"]
      required: [url, altText]
    ShopifyOption:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required: [name, value]
    ShopifyVariant:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        availableForSale:
          type: boolean
        price:
          type: string
        currencyCode:
          type: string
        selectedOptions:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyOption"
      required: [id, title, availableForSale, price, currencyCode, selectedOptions]
    ShopifyProduct:
      type: object
      properties:
        id:
          type: string
        handle:
          type: string
        title:
          type: string
        description:
          type: string
        productType:
          type: string
        tags:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyImage"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyVariant"
      required: [id, handle, title, description, productType, tags, images, variants]
    ShopifyProductsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyProduct"
        totalPublishedProducts:
          type: integer
        truncated:
          type: boolean
      required: [products, totalPublishedProducts, truncated]
    ShopifyCartAddInput:
      type: object
      properties:
        cartId:
          type: string
          minLength: 1
          maxLength: 1000
        merchandiseId:
          type: string
          minLength: 1
          maxLength: 250
        quantity:
          type: integer
          minimum: 1
          maximum: 99
      required: [merchandiseId, quantity]
    ShopifyCartLineUpdate:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 1000
        quantity:
          type: integer
          minimum: 0
          maximum: 99
      required: [id, quantity]
    ShopifyCartUpdateInput:
      type: object
      properties:
        cartId:
          type: string
          minLength: 1
          maxLength: 1000
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ShopifyCartLineUpdate"
      required: [cartId, lines]
    ShopifyCartLine:
      type: object
      properties:
        id:
          type: string
        merchandiseId:
          type: string
        productHandle:
          type: string
        productTitle:
          type: string
        variantTitle:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: string
        currencyCode:
          type: string
        availableForSale:
          type: boolean
        isDemo:
          type: boolean
        image:
          anyOf:
            - $ref: "#/components/schemas/ShopifyImage"
            - type: "null"
      required: [id, merchandiseId, productHandle, productTitle, variantTitle, quantity, unitPrice, currencyCode, availableForSale, isDemo, image]
    ShopifyCartResponse:
      type: object
      properties:
        id:
          type: string
        checkoutUrl:
          type: ["string", "null"]
          format: uri
        totalQuantity:
          type: integer
        subtotalAmount:
          type: string
        currencyCode:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyCartLine"
      required: [id, checkoutUrl, totalQuantity, subtotalAmount, currencyCode, lines]
    ShopifyAdminProductVariant:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        price:
          type: string
        inventoryQuantity:
          type: ["integer", "null"]
        inventoryTracked:
          type: boolean
      required: [id, title, price, inventoryQuantity, inventoryTracked]
    ShopifyAdminProduct:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        handle:
          type: string
        description:
          type: string
        productType:
          type: string
        status:
          type: string
          enum: [ACTIVE, DRAFT, ARCHIVED]
        tags:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
          format: uri
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyAdminProductVariant"
      required: [id, title, handle, description, productType, status, tags, imageUrl, variants]
    ShopifyAdminProductsResponse:
      type: object
      properties:
        currencyCode:
          type: string
        products:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyAdminProduct"
      required: [currencyCode, products]
    ShopifyAdminProductInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 10000
        productType:
          type: string
          maxLength: 100
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 100
        price:
          type: number
          exclusiveMinimum: 0
        inventoryQuantity:
          type: integer
          minimum: 0
        imageUrl:
          type: ["string", "null"]
          format: uri
        publishToWebsite:
          type: boolean
      required: [title, description, productType, tags, price, inventoryQuantity, publishToWebsite]
    ShopifyAdminProductUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 10000
        productType:
          type: string
          maxLength: 100
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 100
        price:
          type: number
          exclusiveMinimum: 0
        inventoryQuantity:
          type: integer
          minimum: 0
        imageUrl:
          type: ["string", "null"]
          format: uri
        publishToWebsite:
          type: boolean
    ShopifyAdminProductResponse:
      type: object
      properties:
        currencyCode:
          type: string
        product:
          $ref: "#/components/schemas/ShopifyAdminProduct"
      required: [currencyCode, product]
    ShopifyAdminArchiveResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    ShopifyAdminDiscount:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [ACTIVE, EXPIRED, SCHEDULED]
        percentage:
          type: number
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: ["string", "null"]
          format: date-time
      required: [id, title, code, status, percentage, startsAt, endsAt]
    ShopifyAdminDiscountsResponse:
      type: object
      properties:
        discounts:
          type: array
          items:
            $ref: "#/components/schemas/ShopifyAdminDiscount"
      required: [discounts]
    ShopifyAdminDiscountInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 64
        percentage:
          type: number
          exclusiveMinimum: 0
          maximum: 100
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: ["string", "null"]
          format: date-time
        usageLimit:
          type: integer
          minimum: 1
        appliesOncePerCustomer:
          type: boolean
      required: [title, code, percentage, appliesOncePerCustomer]
    ShopifyAdminDiscountResponse:
      type: object
      properties:
        discount:
          $ref: "#/components/schemas/ShopifyAdminDiscount"
      required: [discount]

